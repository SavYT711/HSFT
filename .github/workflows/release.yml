name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo tauri build
        working-directory: crates/hsft-app
      - run: gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem target/release/bundle/nsis/*.exe) --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
